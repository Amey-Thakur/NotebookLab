<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotebookLab</title>
    <!-- Fonts self-hosted for offline-first operation -->
    <script>
      /* Apply the persisted theme before first paint so light-theme users
         never see a dark flash. Must stay in sync with theme-provider.tsx. */
      try {
        var stored = localStorage.getItem("notebooklab-theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (_) { /* storage unavailable: keep default */ }
    </script>
    <style>
      /* Boot screen shown until React mounts and replaces #root's children.
         Colors mirror globals.css for both themes so the hand-off is
         invisible; the pulse stands still under reduced-motion. */
      html { background: #111111; }
      html[data-theme="light"] { background: #efece3; }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111111;
      }
      html[data-theme="light"] .boot { background: #efece3; }
      .boot-mark {
        width: 14px;
        height: 14px;
        background: #8ab2ea;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      html[data-theme="light"] .boot-mark { background: #2f62b8; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark { animation: none; opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-mark"></div>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
