# Title: Cargo.toml
# Tech Stack: Rust, Tauri v2, SQLite
# Description: Rust package manifest for the Tauri backend.
# Important Details: All dependencies are unconditional; the only feature flag
#   is Tauri's custom-protocol used for production webview asset serving.

[package]
name = "notebooklab"
version = "0.3.0"
description = "Your thinking partner, on your machine."
authors = ["Amey Thakur", "Archit Konde"]
license = "MIT"
repository = "https://github.com/Amey-Thakur/NotebookLab"
edition = "2021"
rust-version = "1.77"

[lib]
name = "notebooklab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core; shell plugin manages the llama-server sidecar process
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID generation for primary keys
uuid = { version = "1", features = ["v4", "v7"] }

# HTTP client for model downloads and provider API calls
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# File hashing for document deduplication
sha2 = "0.10"


# PDF text extraction
pdf-extract = "0.10"

# Local REST API server for automation
tiny_http = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# panic stays "unwind" so catch_unwind can contain parser panics (see
# pdf_parser.rs) instead of aborting the whole app on a malformed file.
[profile.release]
strip = true
lto = true
codegen-units = 1
