# Dependency updates, kept deliberately quiet.
#
# The previous configuration ran weekly and allowed thirteen open pull requests
# at once, which buried the repository in branches faster than they could be
# reviewed. Each ecosystem now opens at most one grouped pull request a month,
# so updates still arrive but arrive together and on a predictable cadence.
# Major bumps that need migration work stay excluded and are done by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Block major version bumps that require migration work
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # Block major version bumps that require API migration
      - dependency-name: "rusqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # Block major version bumps of every action until manually verified;
      # release-critical actions especially (tauri-action holds the signing key)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
