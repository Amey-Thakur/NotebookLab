##
## Title: ci.yml
## Tech Stack: GitHub Actions, Node.js, Rust, Tauri v2
## Description: Continuous integration pipeline. Runs on every push and PR.
##   Lints frontend, type-checks TypeScript, builds the Vite bundle,
##   and runs cargo check + clippy on the Rust backend.
## Important Details: Uses matrix strategy for cross-platform verification.
##   Rust compilation uses the Tauri action's built-in caching.
##

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

  backend:
    name: Backend (check + clippy)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings
