## Name: ci.yml
## Purpose: Continuous integration pipeline.
## Description: Runs on every push and PR. Backend job builds the frontend
##   first because Tauri's proc macro validates that frontendDist
##   exists at compile time. Third-party actions are pinned to
##   commit SHAs. The vitest suite runs on all three desktop
##   platforms in the backend job, not just Linux.
## Tech Stack: GitHub Actions, Node.js, Rust, Tauri v2
## License: MIT
## Authors: Amey Thakur (https://github.com/Amey-Thakur)
##          Archit Konde (https://github.com/Archit-Konde)
## Date: 2026-07-12

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check + build
        run: npm run build

  backend:
    name: Backend (fmt + check + clippy + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend (required by Tauri proc macro)
        run: |
          npm ci
          npm run build

      - name: Frontend tests
        run: npm test

      - name: Create placeholder sidecar binary
        shell: bash
        run: |
          # Tauri validates sidecar binaries and resources exist at compile time.
          # Create placeholders so cargo check passes without the real download.
          mkdir -p src-tauri/binaries/libs
          touch src-tauri/binaries/libs/.placeholder
          TARGET=$(rustc --print host-tuple 2>/dev/null || rustc -vV | grep host | awk '{print $2}')
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/binaries/llama-server-${TARGET}.exe"
          else
            touch "src-tauri/binaries/llama-server-${TARGET}"
          fi

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
