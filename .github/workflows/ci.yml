##
## Title: ci.yml
## Tech Stack: GitHub Actions, Node.js, Rust, Tauri v2
## Description: Continuous integration pipeline. Runs on every push and PR.
## Important Details: Backend job builds the frontend first because Tauri's proc macro
##   validates that frontendDist exists at compile time.
##

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check + build
        run: npm run build

  backend:
    name: Backend (check + clippy)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend (required by Tauri proc macro)
        run: |
          npm ci
          npm run build

      - name: Create placeholder sidecar binary
        shell: bash
        run: |
          # Tauri validates sidecar binaries exist at compile time.
          # Create a placeholder so cargo check passes in CI.
          mkdir -p src-tauri/binaries
          TARGET=$(rustc --print host-tuple 2>/dev/null || rustc -vV | grep host | awk '{print $2}')
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/binaries/llama-server-${TARGET}.exe"
          else
            touch "src-tauri/binaries/llama-server-${TARGET}"
          fi

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-features

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
