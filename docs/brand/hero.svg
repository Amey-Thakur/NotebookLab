<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="NotebookLab: chat answers grounded in your documents, with cited sources">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e10"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7dd6"/>
      <stop offset="1" stop-color="#2b57a8"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb5f0"/>
      <stop offset="1" stop-color="#4a7dd6"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#bcd7ff" stop-opacity=".9"/><stop offset="1" stop-color="#bcd7ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.8"><stop offset="0" stop-color="#3568c8" stop-opacity=".16"/><stop offset="1" stop-color="#3568c8" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#glow)"/>

  <!-- Brand lockup -->
  <g transform="translate(64,60)">
    <g transform="scale(1.15)">
      <rect x="18" y="8" width="34" height="46" rx="5" fill="url(#back)" opacity=".45"/>
      <rect x="12" y="13" width="34" height="46" rx="5" fill="url(#page)"/>
      <rect x="12" y="13" width="5" height="46" rx="2.5" fill="#ffffff" opacity=".14"/>
      <rect x="21" y="22" width="18" height="3" rx="1.5" fill="#eaf1ff" opacity=".95"/>
      <rect x="21" y="29" width="14" height="3" rx="1.5" fill="#eaf1ff" opacity=".75"/>
      <rect x="21" y="36" width="16" height="3" rx="1.5" fill="#eaf1ff" opacity=".55"/>
      <circle cx="40" cy="48" r="10" fill="url(#halo)"/>
      <circle cx="40" cy="48" r="5" fill="#bcd7ff"/>
      <circle cx="40" cy="48" r="2.2" fill="#1d3f7e"/>
    </g>
    <text x="86" y="52" font-family="'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="700" fill="#eae6e0">NotebookLab</text>
    <text x="88" y="80" font-family="Georgia,serif" font-size="17" fill="#a09a93">Your thinking partner, on your machine.</text>
  </g>

  <!-- Chat panel mockup -->
  <g transform="translate(64,170)">
    <rect width="832" height="308" rx="12" fill="#161a22" stroke="#242a36"/>
    <rect x="0" y="0" width="832" height="44" rx="12" fill="#1b2029"/>
    <rect x="0" y="30" width="832" height="14" fill="#1b2029"/>
    <circle cx="24" cy="22" r="5" fill="#d97f7a"/>
    <circle cx="42" cy="22" r="5" fill="#d9b06a"/>
    <circle cx="60" cy="22" r="5" fill="#6fbf87"/>
    <text x="88" y="27" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8a857f">Chat</text>

    <!-- User bubble -->
    <g transform="translate(430,70)">
      <rect width="360" height="42" rx="8" fill="#243049"/>
      <text x="20" y="26" font-family="Georgia,serif" font-size="15" fill="#cfd8e6">What are the main findings of the study?</text>
    </g>

    <!-- Assistant bubble with citation chips -->
    <g transform="translate(40,128)">
      <rect width="470" height="150" rx="8" fill="#1b212b" stroke="#2a3240"/>
      <text x="20" y="30" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5f8ed6">NotebookLab</text>
      <text x="20" y="56" font-family="Georgia,serif" font-size="14" fill="#c7c2bb">The study reports three findings: a measurable</text>
      <text x="20" y="78" font-family="Georgia,serif" font-size="14" fill="#c7c2bb">drop in cognitive load, faster recall, and higher</text>
      <text x="20" y="100" font-family="Georgia,serif" font-size="14" fill="#c7c2bb">retention over the four-week trial.</text>
      <rect x="20" y="116" width="150" height="22" rx="4" fill="#243049"/>
      <text x="30" y="131" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8fb5f0">research.pdf · p.12</text>
      <rect x="178" y="116" width="132" height="22" rx="4" fill="#243049"/>
      <text x="188" y="131" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8fb5f0">notes.md · Results</text>
    </g>
  </g>

  <!-- Feature strip -->
  <g font-family="'JetBrains Mono',monospace" font-size="12" fill="#8a857f">
    <text x="64" y="512">Local AI</text>
    <text x="200" y="512" fill="#2a3240">•</text>
    <text x="224" y="512">Cited answers</text>
    <text x="392" y="512" fill="#2a3240">•</text>
    <text x="416" y="512">Wiki-linked notes</text>
    <text x="616" y="512" fill="#2a3240">•</text>
    <text x="640" y="512">Fully offline</text>
  </g>
</svg>
